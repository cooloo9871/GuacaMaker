# GuacaMaker - Guacamole 連線設定
# 填入目標 Guacamole 實例的連線資訊

# Guacamole 的完整 base URL（含路徑，不含尾部 /）
GUAC_API_URL=http://localhost:8080/guacamole

# 有管理權限的 Guacamole 帳號
GUAC_ADMIN_USER=guacadmin

# 對應密碼
GUAC_ADMIN_PASS=guacadmin

# Guacamole 資料來源名稱（API 路徑 /api/session/data/{dataSource}/... 用）
# 預設為 mysql；若使用 PostgreSQL 後端，請改為 postgresql
GUAC_DATA_SOURCE=mysql
